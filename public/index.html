<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Order System</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <h1>Mini Order System</h1>
    <p>Create orders, view their status, and update statuses manually.</p>
  </header>

  <main>
    <section class="card">
      <h2>Create a new order</h2>
      <form id="create-order-form" class="form">
        <label>
          Product ID
          <input type="text" name="productId" placeholder="e.g. macbook-pro" required />
        </label>
        <label>
          Quantity
          <input type="number" name="quantity" min="1" step="1" value="1" required />
        </label>
        <label>
          Customer Email
          <input type="email" name="customerEmail" placeholder="e.g. aman@example.com" required />
        </label>
        <button type="submit">Create order</button>
      </form>
      <p id="create-message" class="message" hidden></p>
    </section>

    <section class="card">
      <h2>Orders</h2>
      <p id="orders-empty" hidden>No orders yet. Create one above!</p>
      <div class="table-wrap" id="orders-table-wrap" hidden>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Product</th>
              <th>Qty</th>
              <th>Customer Email</th>
              <th>Status</th>
              <th>Created At</th>
              <th>Update Status</th>
            </tr>
          </thead>
          <tbody id="orders-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
