apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-observer
  namespace: mini-order
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dashboard-observer
  namespace: mini-order
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dashboard-observer
  namespace: mini-order
subjects:
  - kind: ServiceAccount
    name: dashboard-observer
    namespace: mini-order
roleRef:
  kind: Role
  name: dashboard-observer
  apiGroup: rbac.authorization.k8s.io
